<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - ManualFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-gray-50 min-h-screen hidden-body">
    <header class="glass sticky top-0 z-50 border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <div class="h-10 w-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg mr-4">
                        <i class="fas fa-book-open text-white text-lg"></i>
                    </div>
                    <span class="text-xl font-bold gradient-text">ManualFlow Admin</span>
                </div>

                <!-- Navigation -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Dashboard</a>
                    <a href="upload.html" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Upload</a>
                </nav>

                <!-- User Menu & Theme -->
                <div class="flex items-center space-x-4">
                    <button id="themeToggleBtn" class="p-2 text-gray-600 hover:text-gray-900 focus:outline-none transition-colors">
                        <i class="fas fa-moon text-lg" id="themeIcon"></i>
                    </button>
                    <a href="profile.html" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <div class="h-8 w-8 bg-blue-500 rounded-full flex items-center justify-center">
                            <span class="text-white text-sm font-semibold" id="userInitial">A</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-slide-up">
        <div class="glass rounded-2xl p-6 mb-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Gestão de Equipa e Funções</h1>
            <p class="text-gray-600">Altere o nível de permissão de cada membro para controlar quem pode criar, rever ou aprovar manuais.</p>
        </div>

        <div class="glass rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 dark:bg-gray-800">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Utilizador</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Função</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="bg-white dark:bg-gray-900 divide-y divide-gray-200">
                        <tr><td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">A carregar utilizadores...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/firebase-env.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/admin.js"></script>
    <script>
        document.body.classList.remove('hidden-body');
    </script>
</body>
</html>
